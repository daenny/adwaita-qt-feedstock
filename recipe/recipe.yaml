schema_version: 1

context:
  version: "1.4.2"

package:
  name: adwaita-qt6
  version: ${{ version }}

source:
  url: https://github.com/FedoraQt/adwaita-qt/archive/${{ version }}.tar.gz
  sha256: cd5fd71c46271d70c08ad44562e57c34e787d6a8650071db115910999a335ba8
  patches:
    # I think this patch is required because
    # https://github.com/conda-forge/qt-main-feedstock/issues/121
    - do_not_add_qt_include_directories.patch

build:
  number: 6
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
    - if: build_platform != target_platform
      then:
        - qt6-main
  host:
    - qt6-main
    - libxcb
    - if: linux
      then:
        - libgl-devel
        - libegl-devel
        - libdrm
  run_exports:
    # Just a guess...
    weak:
      - ${{ pin_subpackage('adwaita-qt6', upper_bound='x.x') }}

tests:
  - script:
      - test -f ${PREFIX}/lib/qt6/plugins/styles/adwaita.so
      - test -f ${PREFIX}/lib/libadwaitaqt6.so

about:
  homepage: https://github.com/FedoraQt/adwaita-qt
  summary: A native style to bend Qt5/Qt6 applications to look like they belong into GNOME Shell.
  license: LGPL-2.1-only
  license_file:
    - COPYING
    - LICENSE.LGPL2
    - LICENSE.GPL2

extra:
  recipe-maintainers:
    - hmaarrfk
    - daenny
